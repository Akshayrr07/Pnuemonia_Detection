name: Branch protection setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for an administration token
        env:
          CI_ADMIN_TOKEN: ${{ secrets.CI_ADMIN_TOKEN }}
        run: |
          if [ -z "$CI_ADMIN_TOKEN" ]; then
            echo "::error::Set the CI_ADMIN_TOKEN secret to a token with Administration: Read and write access before running this workflow."
            exit 1
          fi

      - name: Configure required checks for main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CI_ADMIN_TOKEN }}
          script: |
            const requiredChecks = [
              "Backend / Python",
              "Backend / Verification tests",
              "Frontend / Next.js",
              "Backend / Docker build",
            ];

            await github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
              required_status_checks: {
                strict: true,
                contexts: requiredChecks,
              },
              enforce_admins: true,
              required_pull_request_reviews: null,
              restrictions: null,
              required_linear_history: true,
              allow_force_pushes: false,
              allow_deletions: false,
              required_conversation_resolution: true,
            });

            console.log(`Configured required checks: ${requiredChecks.join(", ")}`);
