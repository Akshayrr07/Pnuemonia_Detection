name: Auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the pull request associated with this completed CI run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number=$(gh api "repos/${GH_REPO}/pulls?state=all&base=main&head=${GH_REPO}&per_page=100" \
            --jq ".[] | select(.head.sha == env.PR_HEAD_SHA) | .number" | head -n 1)

          if [ -z "$pr_number" ]; then
            echo "No pull request targets this commit; nothing to do."
            exit 0
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge only after the complete CI run is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          state=$(printf '%s' "$pr" | jq -r '.state')
          base_ref=$(printf '%s' "$pr" | jq -r '.base.ref')
          draft=$(printf '%s' "$pr" | jq -r '.draft')
          head_repo=$(printf '%s' "$pr" | jq -r '.head.repo.full_name')
          head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')

          if [ "$state" != "open" ] || [ "$base_ref" != "main" ] || [ "$draft" != "false" ] || [ "$head_repo" != "$GH_REPO" ]; then
            echo "PR #$PR_NUMBER is not eligible for automatic squash merge."
            exit 0
          fi

          if [ "$head_sha" != "$PR_HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER changed after CI completed; refusing to auto-merge."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --squash \
            --auto \
            --match-head-commit "$PR_HEAD_SHA"
