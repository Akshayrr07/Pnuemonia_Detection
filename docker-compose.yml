# Local Docker development for the Pneumonia Detection backend.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXPLAINABILITY: ${INSTALL_EXPLAINABILITY:-false}
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - APP_ENV=${APP_ENV:-development}
      - HF_BINARY_MODEL_ID=${HF_BINARY_MODEL_ID:-}
      - HF_SUBTYPE_MODEL_ID=${HF_SUBTYPE_MODEL_ID:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_API_BASE_URL=${HF_API_BASE_URL:-https://api-inference.huggingface.co/models}
      - PNEUMONIA_THRESHOLD=${PNEUMONIA_THRESHOLD:-0.5}
      - SUBTYPE_THRESHOLD=${SUBTYPE_THRESHOLD:-0.5}
      - HF_REQUEST_TIMEOUT_SECONDS=${HF_REQUEST_TIMEOUT_SECONDS:-60}
      - PREDICTION_DEADLINE_SECONDS=${PREDICTION_DEADLINE_SECONDS:-65}
      - INFERENCE_MAX_CONCURRENCY=${INFERENCE_MAX_CONCURRENCY:-4}
      - INFERENCE_WORKERS=${INFERENCE_WORKERS:-4}
      - INFERENCE_RATE_LIMIT_PER_SECOND=${INFERENCE_RATE_LIMIT_PER_SECOND:-0}
      - UPLOAD_MAX_SIZE_MB=${UPLOAD_MAX_SIZE_MB:-10}
      - MAX_IMAGE_WIDTH=${MAX_IMAGE_WIDTH:-8192}
      - MAX_IMAGE_HEIGHT=${MAX_IMAGE_HEIGHT:-8192}
      - MAX_IMAGE_PIXELS=${MAX_IMAGE_PIXELS:-40000000}
      - MAX_IMAGE_FRAMES=${MAX_IMAGE_FRAMES:-1}
      # Keep unset empty so APP_ENV=production denies CORS by default; the
      # application supplies explicit localhost origins in development.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Optional Grad-CAM settings. The volume is opt-in and the image does not
      # install optional explainability packages by default.
      - LOCAL_MODEL_PATH=${LOCAL_MODEL_PATH:-}
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME:-resnet}
    volumes:
      - ${LOCAL_MODEL_VOLUME:-./models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      # Readiness-gated: /ready returns 503 until the inference pipeline is
      # initialized, so the container reports healthy only when ready.
      test: ["CMD", "python", "-c", "import json, urllib.request; body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)); raise SystemExit(0 if body.get('pipeline_ready') is True else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s
